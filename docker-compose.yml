version: '3.8'

services:
  lagerpro:
    image: node:20-alpine
    container_name: lagerpro
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache python3 make g++ &&
        cd /app/backend &&
        npm install --production &&
        node server.js
      "
    ports:
      - "3000:3000"
    environment:
      - DB_PATH=/data/lager.db
      - JWT_SECRET=AENDERN_SIE_DIESEN_SCHLUESSEL_VOR_DEM_START
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - lagerpro_data:/data
      - /volume2/docker/lagerpro/lager-app:/app:rw
    restart: unless-stopped
    networks:
      - lagerpro_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lagerpro_data:
    driver: local

networks:
  lagerpro_default:
    driver: bridge
